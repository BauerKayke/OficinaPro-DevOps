name: App Infra CI/CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação a ser executada (apply ou destroy)'
        required: true
        default: 'apply'
        type: choice
        options:
        - apply
        - destroy

jobs:
  terraform:
    name: 'Terraform App Infra'
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_github_token: ${{ secrets.GH_TOKEN }} # Token clássico (PAT)
      TF_VAR_github_repo: "BauerKayke/OficinaPro-KaykeBauer" # Repositório da aplicação
      TF_VAR_newrelic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }} # Senha do RDS
      TF_VAR_ssh_private_key_path: "./private_key.pem" # Caminho para a chave privada

    defaults:
      run:
        working-directory: ./app-infra

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # Instala o Helm no Runner
    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: 'v3.13.3'

    - name: Setup SSH Key
      run: |
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
        echo "" >> private_key.pem # Garante quebra de linha final
        chmod 600 private_key.pem
      shell: bash

    - name: Terraform Init
      run: terraform init

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      if: ${{ github.event.inputs.action == 'apply' }}
      run: terraform plan -out=tfplan

    - name: Terraform Apply
      if: ${{ github.event.inputs.action == 'apply' }}
      # O apply agora apenas cria a infra e baixa o kubeconfig via null_resource
      run: terraform apply -auto-approve tfplan

    # --- NOVO STEP: Instalar New Relic via Helm (Shell) ---
    - name: Install New Relic Bundle via Helm
      if: ${{ github.event.inputs.action == 'apply' }}
      run: |
        echo "Adicionando repositório Helm do New Relic..."
        helm repo add newrelic https://helm-charts.newrelic.com
        helm repo update

        echo "Instalando/Atualizando New Relic Bundle..."
        # O kubeconfig já foi configurado pelo null_resource do Terraform em ~/.kube/config
        
        helm upgrade --install newrelic-bundle newrelic/nri-bundle \
          --namespace newrelic \
          --create-namespace \
          --set global.licenseKey=${{ secrets.NEW_RELIC_LICENSE_KEY }} \
          --set global.cluster=OficinaPro-KaykeBauer-cluster \
          --set newrelic-infrastructure.enabled=true \
          --set kube-state-metrics.enabled=true \
          --set opentelemetry.enabled=true \
          --timeout 10m \
          --wait

    - name: Terraform Destroy
      if: ${{ github.event.inputs.action == 'destroy' }}
      run: terraform destroy -auto-approve
