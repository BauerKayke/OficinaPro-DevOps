name: App Infra CI/CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação a ser executada (apply ou destroy)'
        required: true
        default: 'apply'
        type: choice
        options:
        - apply
        - destroy

jobs:
  terraform:
    name: 'Terraform App Infra'
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_github_token: ${{ secrets.GH_TOKEN }} # Token clássico (PAT)
      TF_VAR_github_repo: "BauerKayke/OficinaPro-KaykeBauer" # Repositório da aplicação
      TF_VAR_newrelic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }} # Senha do RDS
      TF_VAR_ssh_private_key_path: "./private_key.pem" # Caminho para a chave privada
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }} # Chave pública para o Key Pair

    defaults:
      run:
        working-directory: ./app-infra

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Setup SSH Key
      run: |
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
        echo "" >> private_key.pem # Garante quebra de linha final
        chmod 600 private_key.pem
      shell: bash

    - name: Terraform Init
      run: terraform init
    
    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      if: ${{ github.event.inputs.action == 'apply' }}
      run: terraform plan -lock=false -out=tfplan

    - name: Terraform Apply
      if: ${{ github.event.inputs.action == 'apply' }}
      # O apply agora apenas cria a infra e baixa o kubeconfig via null_resource
      run: terraform apply -lock=false -auto-approve tfplan

    - name: Terraform Destroy
      if: ${{ github.event.inputs.action == 'destroy' }}
      run: terraform destroy -lock=false -auto-approve
