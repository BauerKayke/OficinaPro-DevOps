name: 'OficinaPro - Auth Infra CI/CD'

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação a ser executada (apply ou destroy)'
        required: true
        default: 'apply'
        type: choice
        options:
        - apply
        - destroy

jobs:
  terraform:
    name: 'Terraform Infra Auth'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Variáveis de ambiente para o Terraform
      TF_VAR_db_host: ${{ secrets.DB_HOST }} # Precisa adicionar esse secret ou pegar do output de app-infra
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v3

    - name: 'Setup Terraform'
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: 'Terraform Init'
      run: terraform init
      working-directory: ./auth-infra

    - name: 'Terraform Validate'
      run: terraform validate -no-color
      working-directory: ./auth-infra

    - name: 'Terraform Plan'
      if: github.event.inputs.action == 'apply'
      run: terraform plan -no-color
      working-directory: ./auth-infra
      continue-on-error: true

    - name: 'Terraform Apply'
      if: github.event.inputs.action == 'apply'
      run: terraform apply -auto-approve
      working-directory: ./auth-infra

    - name: 'Terraform Destroy'
      if: github.event.inputs.action == 'destroy'
      run: terraform destroy -auto-approve
      working-directory: ./auth-infra

