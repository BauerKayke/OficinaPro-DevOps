name: 'OficinaPro - Database Initialization'

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["App Infra CI/CD"]
    types:
      - completed

jobs:
  init-databases:
    name: 'Create Logical Databases'
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Buscar Endpoints'
        id: infra
        run: |
          echo "🔍 Buscando endpoints..."
          
          # Buscar IP do Master Node
          MASTER_IP=$(aws ssm get-parameter --name "/oficinapro/k3s/master-ip" --query "Parameter.Value" --output text)
          echo "master_ip=${MASTER_IP}" >> $GITHUB_OUTPUT
          
          # Buscar Endpoint do RDS
          RDS_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier oficinapro-consolidated-db \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          echo "rds_host=${RDS_ENDPOINT}" >> $GITHUB_OUTPUT
          
          echo "✅ Master IP: ${MASTER_IP}"
          echo "✅ RDS Host: ${RDS_ENDPOINT}"

      - name: 'Executar Script via K3s (Pod Temporário)'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.infra.outputs.master_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_PASSWORD
          script: |
            DB_HOST="${{ steps.infra.outputs.rds_host }}"
            DB_USER="oficinapro_admin"
            export PGPASSWORD="${DB_PASSWORD}"
            
            echo "🚀 Iniciando criação de bancos de dados via Pod Temporário..."
            
            # Criar script SQL
            cat <<EOF > /tmp/init-db.sql
            SELECT 'CREATE DATABASE customer_db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'customer_db')\gexec
            SELECT 'CREATE DATABASE billing_db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'billing_db')\gexec
            SELECT 'CREATE DATABASE execution_db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'execution_db')\gexec
            SELECT 'CREATE DATABASE saga_db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'saga_db')\gexec
            SELECT 'CREATE DATABASE payment_db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'payment_db')\gexec
            EOF
            
            # Rodar Pod Postgres Alpine para executar o script
            # Usa a imagem postgres:alpine que é leve e já tem psql
            sudo kubectl run db-init-job --rm -i --restart=Never \
              --image=postgres:15-alpine \
              --env="PGPASSWORD=${DB_PASSWORD}" \
              -- \
              psql -h $DB_HOST -U $DB_USER -d os_db -f - < /tmp/init-db.sql
            
            echo "🏁 Inicialização de bancos concluída!"
