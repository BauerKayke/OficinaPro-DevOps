# Database Init - Cria databases lógicos no RDS consolidado
# Sequência: App Infra CI/CD (K3s) → database-init → deploys dos serviços
# Suporta K3s (prioridade) e EKS (fallback)

name: 'OficinaPro - Database Initialization'

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["App Infra CI/CD"]
    types:
      - completed

jobs:
  init-databases:
    name: 'Create Logical Databases'
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    env:
      AWS_REGION: us-east-1
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Configurar AWS Credentials'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 'Buscar RDS e Configurar kubectl (K3s ou EKS)'
        id: infra
        run: |
          RDS_HOST=$(aws rds describe-db-instances --db-instance-identifier oficinapro-consolidated-db --query 'DBInstances[0].Endpoint.Address' --output text 2>/dev/null || echo "")
          [ -z "$RDS_HOST" ] || [ "$RDS_HOST" == "None" ] && RDS_HOST=$(aws rds describe-db-instances --query 'DBInstances[?DBInstanceStatus==`available`].Endpoint.Address | [0]' --output text 2>/dev/null || echo "")
          [ -z "$RDS_HOST" ] || [ "$RDS_HOST" == "None" ] && { echo "::error::RDS não encontrado"; exit 1; }
          echo "rds_host=${RDS_HOST}" >> $GITHUB_OUTPUT
          echo "✅ RDS: ${RDS_HOST}"
          
          curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          
          # K3s (prioridade) ou EKS (fallback)
          KUBECONFIG_CONTENT=$(aws ssm get-parameter --name "/oficinapro/k3s/kubeconfig" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -n "$KUBECONFIG_CONTENT" ]; then
            echo "$KUBECONFIG_CONTENT" > /tmp/kubeconfig
            chmod 600 /tmp/kubeconfig
            export KUBECONFIG=/tmp/kubeconfig
            echo "📦 Usando cluster K3s"
          else
            CLUSTER=$(aws ssm get-parameter --name "/oficinapro/eks/cluster-name" --query "Parameter.Value" --output text 2>/dev/null || echo "oficinapro-fase4")
            aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name "$CLUSTER"
            echo "📦 Usando cluster EKS"
          fi
          kubectl get nodes || { echo "::error::Cluster não acessível"; exit 1; }

      - name: 'Init Databases - Job no cluster'
        run: |
          echo "📋 Init via kubectl"
          kubectl create namespace oficinapro-prod --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic db-init-secret --from-literal=password="${{ secrets.DB_PASSWORD }}" -n oficinapro-prod --dry-run=client -o yaml | kubectl apply -f -
          
          RDS="${{ steps.infra.outputs.rds_host }}"
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-init-job
            namespace: oficinapro-prod
          spec:
            ttlSecondsAfterFinished: 120
            backoffLimit: 2
            template:
              spec:
                restartPolicy: OnFailure
                containers:
                - name: init
                  image: postgres:15-alpine
                  env:
                  - name: PGPASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: db-init-secret
                        key: password
                  - name: RDS_HOST
                    value: "${RDS}"
                  command:
                  - sh
                  - -c
                  - |
                    for db in customer_db billing_db execution_db saga_db payment_db; do
                      if ! psql -h \$RDS_HOST -U oficinapro_admin -d os_db -tc "SELECT 1 FROM pg_database WHERE datname = '\$db'" | grep -q 1; then
                        psql -h \$RDS_HOST -U oficinapro_admin -d os_db -c "CREATE DATABASE \$db" && echo "Created \$db" || echo "Skipped \$db"
                      fi
                    done
                    echo "✅ Database init completo"
          EOF
          
          echo "⏳ Aguardando Job completar (timeout 3min)..."
          kubectl wait --for=condition=complete job/db-init-job -n oficinapro-prod --timeout=180s
          kubectl logs job/db-init-job -n oficinapro-prod
          kubectl delete secret db-init-secret -n oficinapro-prod --ignore-not-found

      - name: 'Resumo'
        if: always()
        run: |
          echo "## 📊 Database Init" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**RDS:** \`${{ steps.infra.outputs.rds_host }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Databases:** customer_db, billing_db, execution_db, saga_db, payment_db" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Próximo passo:** Deploy dos serviços (saga, billing, execution, customer, payment, core-domain)" >> $GITHUB_STEP_SUMMARY
