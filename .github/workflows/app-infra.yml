name: App Infra CI/CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação a ser executada (apply ou destroy)'
        required: true
        default: 'apply'
        type: choice
        options:
        - apply
        - destroy

jobs:
  terraform:
    name: 'Terraform App Infra'
    runs-on: ubuntu-latest
    outputs:
      ec2_public_ip: ${{ steps.ec2_ip.outputs.ip }}
      alb_dns: ${{ steps.outputs.outputs.alb_dns }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_key_name: "oficinapro-key" # Nome da chave existente na AWS
      TF_VAR_ssh_private_key_path: "./private_key.pem"

    defaults:
      run:
        working-directory: ./app-infra

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Setup SSH Key
      run: |
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
        echo "" >> private_key.pem # Garante quebra de linha final
        chmod 600 private_key.pem
      shell: bash

    - name: Terraform Init
      run: terraform init

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      if: ${{ github.event.inputs.action == 'apply' }}
      run: terraform plan -lock=false -out=tfplan

    - name: Terraform Apply
      if: ${{ github.event.inputs.action == 'apply' }}
      # O apply agora apenas cria a infra e baixa o kubeconfig via null_resource
      run: terraform apply -lock=false -auto-approve tfplan

    - name: Save IP to AWS Parameter Store
      if: ${{ github.event.inputs.action == 'apply' }}
      run: |
        MASTER_IP=$(terraform output -raw master_public_ip 2>/dev/null || echo "")
        if [ -n "$MASTER_IP" ]; then
          echo "💾 Salvando IP no AWS Parameter Store..."
          aws ssm put-parameter \
            --name "/oficinapro/k3s/ec2-public-ip" \
            --value "$MASTER_IP" \
            --type "String" \
            --overwrite \
            --region us-east-1
          echo "✅ IP salvo em: /oficinapro/k3s/ec2-public-ip"
        fi

    - name: Output EC2 IP
      if: ${{ github.event.inputs.action == 'apply' }}
      id: ec2_ip
      run: |
        MASTER_IP=$(terraform output -raw master_public_ip 2>/dev/null || echo "")
        WORKER_IP=$(terraform output -raw worker_public_ip 2>/dev/null || echo "")
        echo "Master IP: $MASTER_IP"
        echo "Worker IP: $WORKER_IP"
        echo "ip=$MASTER_IP" >> $GITHUB_OUTPUT
        echo ""
        echo "⚠️  IMPORTANTE: Use este IP nos deployments:"
        echo "   Master IP: $MASTER_IP"
        echo ""
        echo "💡 Você pode usar o output 'ec2_public_ip' deste job em outros workflows!"

    - name: Capture All Outputs
      if: ${{ github.event.inputs.action == 'apply' }}
      id: outputs
      run: |
        ALB_DNS=$(terraform output -raw alb_dns_name 2>/dev/null || echo "")
        echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
        echo "ALB DNS: $ALB_DNS"

    - name: Terraform Destroy
      if: ${{ github.event.inputs.action == 'destroy' }}
      run: terraform destroy -lock=false -auto-approve
