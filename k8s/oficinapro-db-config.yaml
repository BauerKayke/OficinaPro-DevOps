apiVersion: v1
kind: ConfigMap
metadata:
  name: oficinapro-db-config
  namespace: oficinapro
data:
  # RDS Configuration (Novo RDS criado via Terraform - PostgreSQL 16.6)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://oficinapro-consolidated-db.cmz0ic48gh2u.us-east-1.rds.amazonaws.com:5432/oficinapro_main_db"
  SPRING_DATASOURCE_USERNAME: "oficinapro_user"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  
  # JPA Configuration
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
  
  # Liquibase (HABILITADO - RDS novo e limpo)
  SPRING_LIQUIBASE_ENABLED: "true"
  
  # Spring Profile
  SPRING_PROFILES_ACTIVE: "production"

  # Java Options (Otimizado para low-traffic - 256MB heap)
  JAVA_OPTS: "-Xmx256m -Xms128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

  # OpenTelemetry
  OTEL_SERVICE_NAME: "oficinapro-core-domain-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://otlp.nr-data.net"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_PROPAGATORS: "tracecontext,baggage"
