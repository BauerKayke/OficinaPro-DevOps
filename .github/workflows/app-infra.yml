name: App Infra CI/CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação a ser executada (apply ou destroy)'
        required: true
        default: 'apply'
        type: choice
        options:
        - apply
        - destroy
      scripts_version:
        description: 'Versão dos scripts (para forçar atualização do user_data)'
        required: false
        default: 'v13-ssm'
        type: string

jobs:
  terraform:
    name: 'Terraform App Infra'
    runs-on: ubuntu-latest
    outputs:
      ec2_public_ip: ${{ steps.ec2_ip.outputs.ip }}
      alb_dns: ${{ steps.outputs.outputs.alb_dns }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_github_token: ${{ secrets.GH_TOKEN }} # Token clássico (PAT)
      TF_VAR_github_repo: "kbmarins/core-domain-service" # Repositório da aplicação
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }} # Senha do RDS
      TF_VAR_ssh_private_key_path: "./private_key.pem" # Caminho para a chave privada
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }} # Chave pública para o Key Pair
      TF_VAR_scripts_version: ${{ github.event.inputs.scripts_version || 'v13-ssm' }} # Versão dos scripts

    defaults:
      run:
        working-directory: ./app-infra

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Setup SSH Key
      run: |
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
        echo "" >> private_key.pem # Garante quebra de linha final
        chmod 600 private_key.pem
      shell: bash

    - name: Terraform Init
      run: terraform init

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      if: ${{ github.event.inputs.action == 'apply' }}
      run: |
        echo "🔍 Planejando infraestrutura..."
        echo "Versão dos scripts: $TF_VAR_scripts_version"
        terraform plan -lock=false -out=tfplan

    - name: Terraform Apply
      if: ${{ github.event.inputs.action == 'apply' }}
      # Cria infra com IAM Instance Profile para SSM + user_data atualizado
      run: |
        echo "🚀 Aplicando infraestrutura..."
        echo "Versão dos scripts: $TF_VAR_scripts_version"
        echo ""
        echo "📋 Mudanças incluídas:"
        echo "  ✅ IAM Role ec2-ssm-role (permissões SSM)"
        echo "  ✅ Instance Profile anexado à EC2"
        echo "  ✅ User data com proteção SSH"
        echo "  ✅ Suporte a deploy via SSM (não requer SSH)"
        echo ""
        terraform apply -lock=false -auto-approve tfplan

    - name: Save IP to AWS Parameter Store
      if: ${{ github.event.inputs.action == 'apply' }}
      run: |
        EC2_IP=$(terraform output -raw k3s_host_public_ip 2>/dev/null || echo "")
        if [ -n "$EC2_IP" ]; then
          echo "💾 Salvando IP no AWS Parameter Store..."
          aws ssm put-parameter \
            --name "/oficinapro/k3s/ec2-public-ip" \
            --value "$EC2_IP" \
            --type "String" \
            --overwrite \
            --region us-east-1
          echo "✅ IP salvo em: /oficinapro/k3s/ec2-public-ip"
        fi

    - name: Output EC2 IP
      if: ${{ github.event.inputs.action == 'apply' }}
      id: ec2_ip
      run: |
        EC2_IP=$(terraform output -raw k3s_host_public_ip 2>/dev/null || echo "")
        echo "EC2 Public IP: $EC2_IP"
        echo "ip=$EC2_IP" >> $GITHUB_OUTPUT
        echo ""
        echo "⚠️  IMPORTANTE: Use este IP nos deployments:"
        echo "   IP: $EC2_IP"
        echo ""
        echo "💡 Você pode usar o output 'ec2_public_ip' deste job em outros workflows!"

    - name: Capture All Outputs
      if: ${{ github.event.inputs.action == 'apply' }}
      id: outputs
      run: |
        ALB_DNS=$(terraform output -raw alb_dns_name 2>/dev/null || echo "")
        echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
        echo "ALB DNS: $ALB_DNS"

    - name: Verify SSM Agent Status
      if: ${{ github.event.inputs.action == 'apply' }}
      run: |
        echo "════════════════════════════════════════════════════════"
        echo "  🔍 VERIFICANDO SSM AGENT"
        echo "════════════════════════════════════════════════════════"
        echo ""

        # Obter Instance ID
        INSTANCE_ID=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=*k3s-node*" "Name=instance-state-name,Values=running" \
          --query "Reservations[*].Instances[*].InstanceId" \
          --output text --region us-east-1)

        if [ -z "$INSTANCE_ID" ]; then
          echo "⚠️  Nenhuma instância encontrada (pode estar inicializando)"
          echo "   Aguarde 3-5 minutos e verifique manualmente"
          exit 0
        fi

        echo "Instance ID: $INSTANCE_ID"
        echo ""
        echo "⏳ Aguardando SSM Agent ficar online (timeout: 3 minutos)..."
        echo ""

        MAX_ATTEMPTS=12  # 3 minutos (15s x 12)
        ATTEMPT=1

        while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
          echo "Tentativa $ATTEMPT de $MAX_ATTEMPTS..."

          SSM_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text 2>/dev/null || echo "NotFound")

          if [ "$SSM_STATUS" == "Online" ]; then
            echo ""
            echo "✅ SSM Agent está ONLINE!"
            echo ""
            echo "📋 Informações da instância:"
            aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].[InstanceId,PingStatus,PlatformType,PlatformVersion]" \
              --output table
            echo ""
            echo "🚀 A instância está pronta para deploy via SSM!"
            echo ""
            echo "💡 Próximos passos:"
            echo "   1. Execute o workflow de deploy do core-domain-service"
            echo "   2. O deploy usará SSM (não requer SSH)"
            echo ""
            exit 0
          fi

          echo "   Status: $SSM_STATUS (aguardando...)"

          if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
            sleep 15
          fi

          ATTEMPT=$((ATTEMPT + 1))
        done

        echo ""
        echo "⚠️  SSM Agent não ficou online após 3 minutos."
        echo ""
        echo "📋 Isso é NORMAL - a instância pode levar 5-10 minutos para:"
        echo "   - Completar user_data (K3s + configurações)"
        echo "   - SSM Agent se registrar"
        echo ""
        echo "🔍 Verificar manualmente em 5 minutos:"
        echo "   aws ssm describe-instance-information \\"
        echo "     --filters \"Key=InstanceIds,Values=$INSTANCE_ID\" \\"
        echo "     --region us-east-1"
        echo ""
        echo "✅ Infraestrutura aplicada com sucesso!"
        echo "   (SSM Agent será verificado no próximo deploy)"
        echo ""

    - name: Summary
      if: ${{ github.event.inputs.action == 'apply' }}
      run: |
        echo "════════════════════════════════════════════════════════"
        echo "  ✅ INFRAESTRUTURA APLICADA COM SUCESSO"
        echo "════════════════════════════════════════════════════════"
        echo ""
        echo "📋 Mudanças implementadas:"
        echo "  ✅ EC2 com IAM Instance Profile (permissões SSM)"
        echo "  ✅ IAM Role: ec2-ssm-role"
        echo "  ✅ User data atualizado (v$TF_VAR_scripts_version)"
        echo "  ✅ Proteção SSH após K3s"
        echo "  ✅ Suporte a deploy via AWS Systems Manager"
        echo ""
        echo "🔐 Segurança:"
        echo "  ✅ Deploy não requer SSH (usa SSM)"
        echo "  ✅ Comunicação criptografada via AWS API"
        echo "  ✅ Auditoria via CloudTrail"
        echo ""
        echo "📍 Outputs:"
        echo "  EC2 IP: ${{ steps.ec2_ip.outputs.ip }}"
        echo "  ALB DNS: ${{ steps.outputs.outputs.alb_dns }}"
        echo ""
        echo "🚀 Próximo passo:"
        echo "  Execute o workflow de deploy do core-domain-service"
        echo "  https://github.com/kbmarins/core-domain-service/actions"
        echo ""
        echo "════════════════════════════════════════════════════════"

    - name: Terraform Destroy
      if: ${{ github.event.inputs.action == 'destroy' }}
      run: terraform destroy -lock=false -auto-approve
