name: Apply NodePort to Saga (EKS)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply NodePort configuration'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:
  apply-nodeport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configurar kubectl (EKS)
        id: k3s
        run: |
          CLUSTER=$(aws ssm get-parameter --name "/oficinapro/eks/cluster-name" --query "Parameter.Value" --output text 2>/dev/null || echo "oficinapro-fase4")
          aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER"
          curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}' 2>/dev/null || kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}' 2>/dev/null)
          echo "node_ip=${NODE_IP}" >> $GITHUB_OUTPUT
          echo "master_ip=${NODE_IP}" >> $GITHUB_OUTPUT
          echo "✅ Node IP: ${NODE_IP}"

      - name: Apply NodePort Configuration
        run: |
          kubectl delete svc saga-orchestrator -n oficinapro-prod 2>/dev/null || true
          kubectl apply -f - <<'EOFYAML'
          apiVersion: v1
          kind: Service
          metadata:
            name: saga-orchestrator
            namespace: oficinapro-prod
          spec:
            type: NodePort
            selector:
              app: saga-orchestrator
            ports:
            - name: http
              port: 8084
              targetPort: 8084
              nodePort: 30084
          EOFYAML
          sleep 5
          kubectl get svc saga-orchestrator -n oficinapro-prod
          echo "✅ NodePort configurado - acesse via Node IP:30084"

      - name: Test External Access
        run: |
          sleep 10
          NODE_IP="${{ steps.k3s.outputs.node_ip }}"
          [ -z "$NODE_IP" ] && NODE_IP="${{ steps.k3s.outputs.master_ip }}"
          curl -X POST http://${NODE_IP}:30084/saga/create-os \
            -H 'Content-Type: application/json' \
            -d '{"clienteId":"b02aa0c2-d2e6-4622-8b78-fa53112e9d43","veiculoPlaca":"SAGA1234","descricaoProblema":"Teste GitHub Actions","valorServicos":1500,"valorPecas":800}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "Connection failed"
