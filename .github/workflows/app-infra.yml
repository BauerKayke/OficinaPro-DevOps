name: 'OficinaPro - App Infra CI/CD'

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação a ser executada (apply ou destroy)'
        required: true
        default: 'apply'
        type: choice
        options:
        - apply
        - destroy

jobs:
  terraform:
    name: 'Terraform Infra Aplicação'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_github_repo: ${{ secrets.GH_REPO_URL }}
      TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
      TF_VAR_newrelic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v3

    - name: 'Setup SSH Key'
      run: |
        # Cria o arquivo da chave
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
        # Garante uma quebra de linha no final para satisfazer o formato PEM/OpenSSH
        echo "" >> private_key.pem
        chmod 600 private_key.pem
        echo "TF_VAR_ssh_private_key_path=$(pwd)/private_key.pem" >> $GITHUB_ENV
      shell: bash

    - name: 'Setup Terraform'
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: 'Terraform Init'
      run: terraform init
      working-directory: ./app-infra

    - name: 'Terraform Validate'
      run: terraform validate -no-color
      working-directory: ./app-infra

    - name: 'Terraform Plan'
      if: github.event.inputs.action == 'apply'
      run: terraform plan -no-color
      working-directory: ./app-infra
      continue-on-error: true

    - name: 'Terraform Apply'
      if: github.event.inputs.action == 'apply'
      run: terraform apply -auto-approve
      working-directory: ./app-infra

    - name: 'Terraform Destroy'
      if: github.event.inputs.action == 'destroy'
      run: terraform destroy -auto-approve
      working-directory: ./app-infra
